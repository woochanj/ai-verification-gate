name: verification-gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST 정기 리그레션
  workflow_dispatch:
    inputs:
      reset_history: { description: '판정 이력을 비우고 이번 실행부터 다시 쌓기', type: boolean, default: false }
      ai_model: { description: 'AI 판정 모델(비우면 기본값)', type: string, default: '' }

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 같은 기준을 세 가지 상황에 돌린다. 성공 여부는 "기대한 판정이 나왔는가"로 정한다.
  gate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: normal, sprint: sprint5, expect: Go }
          - { scenario: bugs, sprint: sprint5-with-bugs, expect: No-Go }
          - { scenario: env-fault, sprint: sprint5, expect: No-Go }
    name: gate (${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/gate-selfcheck.mjs

      - uses: docker/setup-qemu-action@v3 # Toolshop web 이미지가 arm64 전용이라 amd64 러너에서 에뮬레이션 필요

      - name: Toolshop 띄우기 (${{ matrix.sprint }})
        env: { SPRINT: '${{ matrix.sprint }}', DISABLE_LOGGING: 'true' }
        run: |
          dc="docker compose -f toolshop/docker-compose.yml"
          $dc up -d --pull missing
          for i in $(seq 60); do $dc exec -T laravel-api php artisan migrate:fresh --seed --force && $dc exec -T laravel-api php artisan cache:clear && break; sleep 5; done
          for i in $(seq 60); do curl -sf http://127.0.0.1:8091/products >/dev/null && curl -sf http://127.0.0.1:4200 >/dev/null && break; sleep 5; done
          $dc ps -a
          curl -sf http://127.0.0.1:8091/products | head -c 200

      - name: 환경 장애 만들기 (API 웹서버 정지)
        if: matrix.scenario == 'env-fault'
        env: { SPRINT: '${{ matrix.sprint }}' }
        run: docker compose -f toolshop/docker-compose.yml stop web

      - name: 기준 판정 실행
        env: { BASE_URL: 'http://127.0.0.1:4200', API_URL: 'http://127.0.0.1:8091' }
        run: npx playwright test
        continue-on-error: true # 판정은 게이트가 내린다

      - name: AI 판정
        env: { NVIDIA_API_KEY: '${{ secrets.NVIDIA_API_KEY }}', AI_MODEL: '${{ inputs.ai_model }}' }
        run: node scripts/ai-judge.mjs

      - name: 배포 게이트
        env: { SCENARIO: '${{ matrix.scenario }}', EXPECT: '${{ matrix.expect }}' }
        run: node scripts/gate.mjs > /dev/null; s=$?; cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; exit $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.scenario }}
          path: |
            out/
            test-results/

  pages:
    needs: gate
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'result-*', path: artifacts }
      - name: 시나리오 결과 모으기
        run: |
          for d in artifacts/result-*; do s=${d#artifacts/result-}; mkdir -p results/$s; cp $d/out/result.json results/$s/ 2>/dev/null || true; cp -r $d/out/videos results/$s/ 2>/dev/null || true; done
          mkdir -p out/site
      - name: 이전 판정 이력 받기
        if: ${{ !inputs.reset_history }}
        run: curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" -o out/site/history.json || true
      - run: node scripts/site.mjs results
      - uses: actions/upload-pages-artifact@v3
        with: { path: out/site }
      - id: deploy
        uses: actions/deploy-pages@v4
